server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location / {
    try_files $uri $uri/ =404;
  }

  # Por enquanto, a raiz do domínio abre a página do White Label.
  location = / {
    rewrite ^ /whitelabel/index.html last;
  }

  # A página do cliente final mora em /lp/.
  location = /lp {
    return 301 /lp/;
  }

  # A página do white label mora em /whitelabel/.
  location = /whitelabel {
    return 301 /whitelabel/;
  }

  # Segunda versão da página, com vídeo no topo.
  location = /whitelabel-v2 {
    return 301 /whitelabel-v2/;
  }

  # Páginas e configs não têm versão no nome: o navegador sempre confere.
  location ~ ^/((whitelabel(-v2)?|lp)/)?(index\.html|config\.js)$ {
    add_header Cache-Control "no-cache";
  }

  # CSS e JS levam ?v= no index.html; imagens mudam pouco.
  location ~* \.(css|js|webp|jpg|jpeg|png|svg|ico)$ {
    expires 7d;
  }
}
