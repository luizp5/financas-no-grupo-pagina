server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location / {
    try_files $uri $uri/ =404;
  }

  # A página do white label mora em /whitelabel/.
  location = /whitelabel {
    return 301 /whitelabel/;
  }

  # Páginas e configs não têm versão no nome: o navegador sempre confere.
  location ~ ^/(whitelabel/)?(index\.html|config\.js)$ {
    add_header Cache-Control "no-cache";
  }

  # CSS e JS levam ?v= no index.html; imagens mudam pouco.
  location ~* \.(css|js|webp|jpg|jpeg|png|svg|ico)$ {
    expires 7d;
  }
}
